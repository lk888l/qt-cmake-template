name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.7.3

jobs:
  windows-msvc:
    name: Windows / MSVC 2022
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Export preset environment
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "QT_MSVC_ROOT=$env:QT_ROOT_DIR"

      - name: Configure
        run: cmake --preset windows-msvc -DQTAPP_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset windows-msvc-release

      - name: Test
        run: ctest --preset windows-msvc-release

      - name: Verify install and deployment
        run: cmake --install out/build/windows-msvc --config Release --prefix "$env:GITHUB_WORKSPACE/out/stage-msvc"

      - name: Verify package
        run: cpack --preset windows-msvc-release

  windows-mingw:
    name: Windows / MinGW
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt and matching MinGW
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1120
          cache: true

      - name: Export and verify preset environment
        shell: pwsh
        run: |
          $compiler = (Get-Command g++.exe).Source
          $compilerVersion = & $compiler -dumpfullversion
          if ($compilerVersion -ne "11.2.0") {
            throw "Expected Qt's MinGW 11.2.0 toolchain, found $compilerVersion at $compiler"
          }
          $mingwRoot = Split-Path (Split-Path $compiler -Parent) -Parent
          $ninjaRoot = Split-Path (Get-Command ninja.exe).Source -Parent
          Add-Content -Path $env:GITHUB_ENV -Value "QT_MINGW_ROOT=$env:QT_ROOT_DIR"
          Add-Content -Path $env:GITHUB_ENV -Value "MINGW_ROOT=$mingwRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "NINJA_ROOT=$ninjaRoot"

      - name: Configure
        run: cmake --preset windows-mingw-release -DQTAPP_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset windows-mingw-release

      - name: Test
        run: ctest --preset windows-mingw-release

      - name: Verify install and deployment
        run: cmake --install out/build/windows-mingw-release --prefix "$env:GITHUB_WORKSPACE/out/stage-mingw"

      - name: Verify package
        run: cpack --preset windows-mingw-release
